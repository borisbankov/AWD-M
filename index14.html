<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div class="bg-success-subtle container-fluid navbar navbar-expand-lg">
      <div class="row w-100">
        <div class="col-auto">
          <div class="navbar-brand">Arcadala</div>
        </div>
        <div class="col ">
          <ul class="navbar-nav d-flex justify-content-center" data-bs-theme="light">
            <li class="nav-item"><a href="#" class="nav-link active">Home</a></li>
            <li class="nav-item"><a href="#" class="nav-link ">About</a></li>
            <li class="nav-item"><a href="#" class="nav-link ">Catalog</a></li>
            <li class="nav-item"><a href="#" class="nav-link ">Contacts</a></li>
          </ul>
        </div>
      </div>
    </div>
    <div class="container-fluid overflow-hidden" style="height: calc(100vh - 56px);">
      <div class="row">
        <div class="col-6 px-0">
          <div class="card text-light border-0 rounded-0 position-relative">
            <img src="https://images.unsplash.com/photo-1794064594662-6e65467c0543?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="" class="card-img rounded-0">
            <div class="card-img-overlay">
              <div class="position-absolute bottom-50">
                <div class="h3">Welcome to Arcadala</div>
                <div class="mb-3">We build Better Worlds</div>
                <a href="#" class="btn btn-outline-light">Show Destination</a>
                </div>
              </div>
          </div>
        </div>
        <div class="col-6 px-0">
          <div class="card text-light border-0 rounded-0">
            <img src="https://images.unsplash.com/photo-1793253261196-a4bc70fe0dea?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="" class="card-img rounded-0">
            <div class="card-img-overlay">
              <div class="display-4">Travel the world</div>
              <div class="my-4">Enjoy different cultures</div>
              <a href="#" class="btn btn-info">Start now &rarr;</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>

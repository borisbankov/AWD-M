<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<div class="container">
		<div class="row">
			<div class="col">
				<h1 class="text-center">Вход в системата</h1>
			</div>
		</div>
		<div class="row my-5">
			<div class="col-12 col-lg-6">
				<label for="" class="form-label">Имейл</label>
				<input type="email" class="form-control" placeholder="Text">
			</div>
			<div class="col-12 col-lg-6">
				<label for="" class="form-label">Парола</label>
				<input type="password" class="form-control" placeholder="Text">
			</div>
		</div>
		<div class="row justify-content-center text-center">
			<div class="col-12 col-lg-4">
				<input type="checkbox" class="form-check-input">
				<label for="form-check-label">Не ме отписвай автоматично</label>
			</div>
			<div class="col-12 col-lg-4 d-grid mt-5 order-lg-4">
				<input type="submit" class="btn btn-primary">
			</div>
			<div class="col-12 col-lg-4">
				<a href="#">Нямате профил? Регистрирайте се</a>	
			</div>
			<div class="col-12 col-lg-4">
				<a href="#">Забравена парола</a>
			</div>
			
		</div>
	</div>	
</body>
</html>
